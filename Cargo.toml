[package]
name = "verus-lint"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Lint and analysis for Verus codebases, from Verus VIR logs and verification reports"
keywords = ["verus", "lint", "verification", "duckdb"]
categories = ["development-tools"]
repository = "https://github.com/uw-syfi/verus-lint"
readme = "README.md"
rust-version = "1.88"
# Design notes and the fixture's Verus source crate (rebuilt with Docker) stay out of the package.
exclude = ["DESIGN.md", "tests/fixtures/crate/", "tests/fixtures/regen.sh", "target/", ".agents/", ".claude/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
duckdb = { version = "1.10506.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[lints]
workspace = true

[workspace]
members = [".", "examples/rust-rules"]
exclude = ["tests/fixtures/crate"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Transitive duplicates (hashbrown, syn) come from duckdb and serde; not controllable here.
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
